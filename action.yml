name: mcp-faultlab
description: Run Agent fault-injection and replay safety scenarios
inputs:
  scenario:
    description: Path to a mcp-faultlab scenario file
    required: true
  out:
    description: Directory for JSON, cassette and HTML reports
    required: false
    default: faultlab-report
runs:
  using: composite
  steps:
    - name: Install mcp-faultlab
      shell: bash
      run: python3 -m pip install --quiet --no-build-isolation .
    - name: Run scenario
      shell: bash
      run: mcp-faultlab run "${{ inputs.scenario }}" --out "${{ inputs.out }}"
    - name: Upload mcp-faultlab report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mcp-faultlab-report
        path: ${{ inputs.out }}
