[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-faultlab"
version = "0.2.1"
description = "Deterministic failure testing for MCP tools and AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcp-faultlab contributors" }]
dependencies = []

[project.scripts]
mcp-faultlab = "mcp_faultlab.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_faultlab*"]
