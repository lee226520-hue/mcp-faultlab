[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-faultlab"
version = "0.4.1"
description = "Failure injection, attack testing and replay regression for agents"
requires-python = ">=3.9"

[project.scripts]
mcp-faultlab = "mcp_faultlab.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_faultlab*"]
