name: test mcp-faultlab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --no-build-isolation .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate examples
        run: |
          mcp-faultlab validate examples/tool-timeout-recovery.yml
          mcp-faultlab validate examples/agent-prompt-injection-safe.yml
